<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>웹 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F9E9ED;--paper:#fff;--ink:#2B1C22;--muted:#7B636B;--line:#EBD3DA;--soft:#F7E1E9;--accent:#7C2449;--ok:#2F7A55;--warn:#7A4300;--warnbg:#FFF4E5;--code:#2B1C22;--codeink:#F8EAEF;--add:#4b6b2a;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--soft);color:var(--accent);padding:1px 5px;border-radius:4px}
[hidden]{display:none!important}
kbd{font-family:'JetBrains Mono',monospace;font-size:.82em;border:1px solid var(--line);border-bottom-width:2px;background:#fff;padding:0 5px;border-radius:4px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 11px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:#a3122f}
.btn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 11px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
/* 상단 */
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .hub{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.top .nm{font-weight:800;font-size:17px;white-space:nowrap}
.top .sp{flex:1}
/* 3단 */
.studio{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;height:calc(100% - 52px)}
.left,.right{background:var(--paper);overflow:auto;min-height:0}
.left{border-right:1px solid var(--line);padding:12px}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:800}
h3:first-child{margin-top:0}
/* 페이지 목록 */
.pages{display:flex;flex-direction:column;gap:4px}
.pg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px;padding:7px 9px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.pg:hover{background:var(--soft)}
.pg.on{border-color:var(--accent);background:var(--soft)}
.pg .f{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.pg .l{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip.new{background:#e6f1ea;color:var(--ok)}
.chip.mod{background:var(--warnbg);color:var(--warn)}
.chip.same{background:#eee;color:#777}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* 블록 */
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.blk{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 9px}
.blk:hover{border-color:var(--accent);background:var(--soft)}
.blk b{font-size:14px}
.blk span{font-size:11px;color:var(--muted);line-height:1.3}
.bhd{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--muted);margin:6px 0 0;letter-spacing:.06em}
.emo{display:flex;flex-wrap:wrap;gap:2px;margin:-2px 0 8px}
.emo button{border:0;background:none;font-size:18px;padding:2px 3px;border-radius:6px;line-height:1.2}
.emo button:hover{background:var(--soft)}
.comp{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fffafc}
.comp>b{display:block;color:var(--accent);margin-bottom:6px}
.where{font-size:13px;display:flex;flex-direction:column;gap:3px;margin:8px 0 0;padding:8px;border-radius:9px;background:var(--bg)}
.where label{display:flex;gap:6px;align-items:center}
/* 미리보기 */
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvbar .hint{font-size:13px;color:var(--muted);flex:1;min-width:160px}
.stage{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;justify-content:center}
.frame{position:relative;width:100%;height:100%;min-height:400px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:max-width .2s}
.frame.phone{max-width:390px;border-width:8px;border-color:#2B1C22;border-radius:28px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame iframe.back{visibility:hidden}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper)}
.start{max-width:560px;text-align:center}
.start h2{font-size:24px;margin:0 0 6px}
.start p{color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper)}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
/* 오른쪽 탭 */
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.tabs button{flex:1;border:0;background:none;padding:11px 4px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:99px;background:#c0392b;color:#fff;font-size:11px}
.pane{padding:12px;overflow:auto;flex:1;min-height:0}
.pane.code{padding:0;display:flex;flex-direction:column}
.none{color:var(--muted);font-size:14px;padding:18px 6px;text-align:center}
.tagbox{border-radius:12px;background:var(--bg);padding:10px 12px;margin-bottom:10px}
.tagbox .tg{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);font-size:15px}
.tagbox .kn{font-weight:800}
.tagbox p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.crumb{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 10px;font-size:12px}
.crumb button,.kids button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:1px 7px;font-family:'JetBrains Mono',monospace;font-size:12px}
.crumb button:hover,.kids button:hover{border-color:var(--accent)}
.kids{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.grp{border-top:1px solid var(--line);padding:10px 0 4px}
.grp>b{display:block;font-size:13px;margin-bottom:6px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font-size:13px}
.fld>span{color:var(--muted);font-weight:600}
.fld input[type=text],.fld input[type=url],.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clr{display:flex;gap:6px;align-items:center}
.clr input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:6px;padding:1px;background:#fff}
.note{font-size:13px;border-radius:9px;padding:8px 10px;margin:6px 0;background:var(--warnbg);color:var(--warn)}
.note.tip{background:var(--soft);color:var(--ink)}
/* 코드 */
.codebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.codebar .info{font-size:12px;color:var(--muted);width:100%}
pre.src{margin:0;flex:1;overflow:auto;background:var(--code);color:var(--codeink);font:12px/1.6 'JetBrains Mono',monospace;padding:8px 0;counter-reset:ln;tab-size:2}
pre.src .ln{display:block;padding:0 10px 0 46px;position:relative;white-space:pre-wrap;word-break:break-all;min-height:1.6em}
pre.src .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:36px;text-align:right;color:#8f7680}
pre.src .ln.add{background:rgba(160,220,120,.18);box-shadow:inset 3px 0 #9fd27a}
textarea.srcedit{flex:1;border:0;background:var(--code);color:var(--codeink);font:12px/1.6 'JetBrains Mono',monospace;padding:10px;resize:none;white-space:pre}
/* 올리기 */
.issue{display:block;width:100%;text-align:left;border:1px solid #f0c9a8;background:var(--warnbg);color:var(--warn);border-radius:9px;padding:7px 10px;margin-bottom:5px;font-size:13px}
.issue.ok{border-color:#bfe0cc;background:#eaf6ef;color:var(--ok)}
.up{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.up .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.up .hd .f{font-family:'JetBrains Mono',monospace;font-weight:700}
.up ol{margin:4px 0 8px;padding-left:20px;font-size:13px}
.up ol li{margin:2px 0}
.bn{display:inline-block;font-size:.9em;font-weight:600;padding:0 6px;border-radius:5px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.bn.g{background:#1F883D;color:#fff;border-color:transparent}
/* 모달·토스트 */
.modal{position:fixed;inset:0;background:rgba(43,28,34,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.box{background:var(--paper);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.box h2{margin:0 0 4px;font-size:19px}
.box .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.box textarea.paste{width:100%;height:200px;font:12px/1.5 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.err{color:#a3122f;font-size:13px;min-height:1.4em;margin-top:4px}
.radios{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.radios label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.radios label small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:200;max-width:90vw;text-align:center}
.toast.alert{background:#fff;color:var(--ink);border:2px solid var(--accent)}
@media (max-width:1100px){.studio{grid-template-columns:220px minmax(0,1fr) 320px}}
@media (max-width:860px){body{overflow:auto}.studio{display:flex;flex-direction:column;height:auto}.center{height:80vh}.left,.right{border:0}.top{flex-wrap:wrap;height:auto;padding:8px 12px}}
</style>
</head>
<body>
<header class="top">
  <a class="hub" href="./index.html">← 실습 허브</a>
  <span class="nm">웹 스튜디오</span>
  <span class="sp"></span>
  <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
  <button class="btn" id="redo" title="다시 실행 (Ctrl+Y)">↷</button>
  <button class="btn" id="restart">처음부터</button>
</header>
<div class="studio">
  <aside class="left">
    <h3>페이지 (파일)</h3>
    <div class="pages" id="pages"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm pri" id="addPage">＋ 새 페이지</button>
      <button class="btn sm" id="navAll">모든 페이지에 메뉴</button>
    </div>
    <h3>블록 넣기</h3>
    <div class="blocks" id="blocks"></div>
    <div class="where">
      <b style="font-size:12px;color:var(--muted)">넣을 위치</b>
      <label><input type="radio" name="where" value="after" checked> 선택한 요소 바로 아래</label>
      <label><input type="radio" name="where" value="inside"> 선택한 요소 안쪽 맨 아래</label>
    </div>
    <h3>사이트 설정</h3>
    <div class="fld"><span>포인트 색 (메뉴·버튼·블록)</span><div class="clr"><input type="color" id="accent"><span id="accentTx" style="font-family:'JetBrains Mono',monospace;font-size:12px"></span></div></div>
    <div class="fld"><span>글꼴 (모든 페이지)</span><select id="font"></select></div>
    <h3>작업 보관</h3>
    <div class="row">
      <button class="btn sm" id="saveAll">모든 파일 내려받기</button>
      <button class="btn sm" id="loadFiles">파일 불러오기</button>
      <input type="file" id="fileIn" accept=".html,text/html" multiple hidden>
    </div>
  </aside>
  <main class="center">
    <div class="pvbar">
      <div class="seg" role="group" aria-label="모드"><button id="mEdit" aria-pressed="true">✎ 편집</button><button id="mRun" aria-pressed="false">▶ 동작 보기</button></div>
      <div class="seg" role="group" aria-label="화면 크기"><button id="vPc" aria-pressed="true">PC</button><button id="vPhone" aria-pressed="false">폰</button></div>
      <span class="hint" id="hint">편집: 바꿀 부분을 눌러요. ⠿ 손잡이를 끌면 위치를 옮겨요.</span>
    </div>
    <div class="stage"><div class="frame" id="frame">
      <iframe id="pvA" title="미리보기" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
      <iframe id="pvB" class="back" title="미리보기" sandbox="allow-scripts allow-same-origin allow-forms" aria-hidden="true"></iframe>
      <iframe id="mfr" title="폰 점검" sandbox="allow-scripts allow-same-origin" aria-hidden="true" tabindex="-1" style="position:fixed;left:-10000px;top:0;width:375px;height:740px;border:0;visibility:visible"></iframe>
      <div class="empty" id="empty">
        <div class="start">
          <h2>어떻게 시작할까요?</h2>
          <p>작업 내용은 이 브라우저에 자동으로 저장되고, 1시간 동안 쓰지 않으면 자동으로 지워져요.</p>
          <div class="opts">
            <button class="opt" id="stPaste"><b>내 코드 붙여넣기</b><span>GitHub의 index.html 코드나 Gemini가 만든 HTML 코드로 시작해요.</span></button>
            <button class="opt" id="stTpl"><b>기본 틀로 새로 만들기</b><span>코드 없이 빈 페이지에서 블록을 넣어 만들어요.</span></button>
            <button class="opt" id="stFile"><b>내려받아 둔 파일 불러오기</b><span>지난 시간에 <b>모든 파일 내려받기</b>로 저장한 .html 파일들을 한 번에 골라요.</span></button>
          </div>
        </div>
      </div>
    </div></div>
  </main>
  <aside class="right">
    <div class="tabs" role="tablist">
      <button role="tab" id="tProps" aria-selected="true">속성</button>
      <button role="tab" id="tCode" aria-selected="false">코드</button>
      <button role="tab" id="tUp" aria-selected="false">올리기<span class="n" id="upN" hidden></span></button>
    </div>
    <div class="pane" id="pProps"></div>
    <div class="pane code" id="pCode" hidden>
      <div class="codebar">
        <button class="btn sm pri" id="cpCode">이 페이지 코드 복사</button>
        <button class="btn sm" id="dlCode">파일로 저장</button>
        <button class="btn sm" id="editCode" aria-pressed="false">코드 직접 고치기</button>
        <span class="info" id="codeInfo"></span>
      </div>
      <pre class="src" id="src"></pre>
      <textarea class="srcedit" id="srcEdit" spellcheck="false" hidden></textarea>
    </div>
    <div class="pane" id="pUp" hidden></div>
  </aside>
</div>
<script>
(function () {
  'use strict';
  var KEY = 'web-studio-v1';
  var $ = function (id) { return document.getElementById(id); };
  var DEF_ACCENT = '#e2557a';
  var SKIP = /^(SCRIPT|STYLE|TEMPLATE|LINK|META|NOSCRIPT|TITLE|BASE)$/;
  var VOID = /^(IMG|INPUT|HR|BR|IFRAME|VIDEO|CANVAS|SVG|TEXTAREA|SELECT|SB-WIDGET)$/;
  var INLINE = /^(B|STRONG|I|EM|U|SMALL|MARK|BR|SPAN|SUB|SUP|S)$/;
  var IMG_PH = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="800" height="500" fill="#ececec"/><text x="400" y="262" font-family="sans-serif" font-size="40" fill="#999" text-anchor="middle">사진</text></svg>');

  var STCSS = [
    '.st-nav{position:sticky;top:0;z-index:50;width:100%;box-sizing:border-box;background:#fff;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.08)}',
    '.st-nav-in{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 12px;max-width:960px;margin:0 auto}',
    '.st-nav-a{display:inline-block;padding:8px 14px;border-radius:999px;text-decoration:none;color:#333;font-weight:700;font-size:15px;line-height:1.2}',
    '.st-nav-a:hover{background:rgba(0,0,0,.06)}',
    '.st-nav-a.is-on{background:var(--st-accent);color:#fff}',
    '.st-sec{box-sizing:border-box;width:100%;max-width:960px;margin:24px auto;padding:20px}',
    '.st-h{font-size:1.6rem;font-weight:800;line-height:1.3;margin:0 0 12px}',
    '.st-p{font-size:1rem;line-height:1.75;margin:0 0 12px}',
    '.st-btn{display:inline-block;padding:12px 22px;border-radius:12px;background:var(--st-accent);color:#fff!important;text-decoration:none;font-weight:700;font-size:1rem;line-height:1.2;border:0;cursor:pointer;margin:4px}',
    '.st-btn:hover{filter:brightness(1.08)}',
    '.st-img{margin:16px auto;text-align:center}',
    '.st-img img{display:inline-block;width:100%;max-width:100%;height:auto;border-radius:12px}',
    '.st-hero{text-align:center;padding:48px 20px;border-radius:20px;background:#f6f6f6;background:color-mix(in srgb,var(--st-accent) 12%,#fff)}',
    '.st-hero .st-h{font-size:2rem}',
    '.st-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}',
    '.st-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:left}',
    '.st-ico{font-size:2rem;line-height:1;margin:0 0 8px}',
    '.st-card .st-h{font-size:1.15rem;margin:0 0 6px}',
    '.st-card .st-p{margin:0;font-size:.95rem}',
    '.st-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:center}',
    '@media(max-width:600px){.st-split{grid-template-columns:1fr}}',
    '.st-split img{display:block;width:100%;height:auto;border-radius:16px}',
    '.st-list{margin:0;padding-left:1.3em;line-height:1.9}',
    '.st-hr{border:0;border-top:2px dashed rgba(0,0,0,.15);margin:28px auto;max-width:960px}',
    '.st-foot{text-align:center;font-size:.875rem;opacity:.7;padding:24px 12px}',
    '.st-tab-bar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid rgba(0,0,0,.08);margin-bottom:14px}',

      var ol = document.createElement('ol');
      if (st === 'new') ol.innerHTML = '<li>저장소 첫 화면 → <b>Go to file</b> 옆 <span class="bn">＋</span> (Add file) → <span class="bn">Create new file</span></li><li>이름 칸에 <code>' + esc(p.name) + '</code> 붙여넣기</li><li>코드 칸에 코드 붙여넣기 (<kbd>Ctrl</kbd>+<kbd>V</kbd>)</li><li><span class="bn g">Commit changes...</span> → 한글 메시지 → <span class="bn g">Commit changes</span></li>';
      else if (st === 'mod') ol.innerHTML = '<li>저장소에서 <code>' + esc(p.name) + '</code> → 연필 ✏</li><li>코드 칸을 누르고 <kbd>Ctrl</kbd>+<kbd>A</kbd> → <kbd>Ctrl</kbd>+<kbd>V</kbd></li><li><span class="bn g">Commit changes...</span> → 한글 메시지 → <span class="bn g">Commit changes</span></li>';
      else ol.innerHTML = '<li style="list-style:none;margin-left:-20px;color:var(--muted)">올린 뒤로 바뀐 게 없어요. 다시 올리지 않아도 돼요.</li>';
      c.appendChild(ol);
      var r = document.createElement('div'); r.className = 'row';
      if (st === 'new') { var nb = btn('이름 복사', function () { copy(p.name, nb); }); r.appendChild(nb); }
      if (st !== 'same') {
        var cb = btn('코드 복사', function () { if (doc && p === cur()) p.html = ser(doc); copy(p.html, cb); }, 'pri'); r.appendChild(cb);
        r.appendChild(btn('올렸어요', function () { p.base = p.html; save(); drawPages(); drawUp(); toast(p.name + ' 올림 표시를 했어요.'); }));
      }
      c.appendChild(r); P.appendChild(c);
    });
    // 배포 확인
    var h3 = document.createElement('h3'); h3.textContent = '배포 확인 (올리고 1~2분 뒤)'; h3.style.marginTop = '16px'; P.appendChild(h3);
    var dn = document.createElement('div'); dn.className = 'note tip'; dn.textContent = '내 사이트 주소에서 파일을 하나씩 열어 보고, 웹 스튜디오의 코드와 똑같이 올라갔는지 비교해요. 파일 이름이 틀렸거나 빠뜨린 파일을 찾아 줘요.'; P.appendChild(dn);
    var site = S.site || {}, two = document.createElement('div'); two.className = 'two';
    var ui = inp('text', site.user || '', '내 GitHub 아이디'), ri = inp('text', site.repo || 'my-page');
    two.appendChild(fld('GitHub 아이디', ui)); two.appendChild(fld('저장소 이름', ri)); P.appendChild(two);
    var res = document.createElement('div'); res.id = 'dpOut';
    var go = btn('배포 확인', function () {
      var u = ui.value.trim().toLowerCase(), r = ri.value.trim() || 'my-page';
      if (!/^[a-z0-9-]+$/.test(u)) { res.innerHTML = '<div class="issue">GitHub 아이디를 정확히 써요 (영어·숫자·하이픈).</div>'; return; }
      S.site = { user: u, repo: r }; save();
      if (doc && cur()) cur().html = ser(doc);
      deployCheck(u, r, res);
    }, 'pri');
    P.appendChild(go); P.appendChild(res);
  }
  function normTxt(t) { return String(t).replace(/\r/g, '').split('\n').map(function (l) { return l.replace(/\s+$/, ''); }).join('\n').trim(); }
  function deployCheck(u, r, out) {
    var base = 'https://' + u + '.github.io/' + r + '/';
    out.innerHTML = '<div class="issue ok" style="background:var(--bg);border-color:var(--line);color:var(--muted)">확인하는 중…</div>';
    Promise.all(S.pages.map(function (p) {
      return fetch(base + p.name + '?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
        if (res.status === 404) return { p: p, s: 'none' };
        if (!res.ok) return { p: p, s: 'err' };
        return res.text().then(function (t) { return { p: p, s: normTxt(t) === normTxt(p.html) ? 'ok' : 'diff' }; });
      }, function () { return { p: p, s: 'err' }; });
    })).then(function (rs) {
      out.innerHTML = '';
      var bad = 0;
      rs.forEach(function (x) {
        var d = document.createElement('div'); d.className = 'issue' + (x.s === 'ok' ? ' ok' : '');
        var m = { ok: '✓ 배포됨 · 웹 스튜디오 코드와 같아요', none: '✗ 사이트에 이 파일이 없어요 (404). GitHub에 올렸는지, 파일 이름이 정확히 "' + x.p.name + '"인지(소문자·.html 포함) 확인해요.', diff: '⚠ 사이트의 코드가 웹 스튜디오와 달라요. 방금 올렸다면 1~2분 뒤 다시 확인하고, 그래도 다르면 코드 복사 → 붙여넣기를 다시 해요.', err: '? 확인할 수 없어요. 아이디·저장소 이름과 인터넷 연결을 확인해요.' }[x.s];
        if (x.s !== 'ok') bad++;
        d.textContent = x.p.name + ' · ' + m; out.appendChild(d);
      });
      var a = document.createElement('a'); a.href = base; a.target = '_blank'; a.rel = 'noopener'; a.textContent = base + ' 열기 ↗'; a.style.cssText = 'font-size:13px;color:var(--accent)';
      out.appendChild(a);
      if (!bad) toast('모든 파일이 배포됐어요!');
    });
  }

  // ---------- 탭·모드·보기 ----------
  function showTab(t) {
    [['props', 'tProps', 'pProps'], ['code', 'tCode', 'pCode'], ['up', 'tUp', 'pUp']].forEach(function (x) { var on = x[0] === t; $(x[1]).setAttribute('aria-selected', on ? 'true' : 'false'); $(x[2]).hidden = !on; });
    if (t === 'code') drawCode();
  }
  $('tProps').addEventListener('click', function () { showTab('props'); });
  $('tCode').addEventListener('click', function () { showTab('code'); });
  $('tUp').addEventListener('click', function () { if (doc && cur()) cur().html = ser(doc); drawUp(); showTab('up'); });
  function setMode(m) {
    mode = m; $('mEdit').setAttribute('aria-pressed', m === 'edit'); $('mRun').setAttribute('aria-pressed', m === 'run');
    $('hint').textContent = m === 'edit' ? '편집: 바꿀 부분을 눌러요. ⠿ 손잡이를 끌면 위치를 옮겨요.' : '동작 보기: 버튼·링크·퀴즈를 실제처럼 눌러 봐요. 메뉴를 누르면 그 페이지로 이동해요.';
    render();
  }
  $('mEdit').addEventListener('click', function () { setMode('edit'); });
  $('mRun').addEventListener('click', function () { setMode('run'); });
  $('vPc').addEventListener('click', function () { $('frame').classList.remove('phone'); this.setAttribute('aria-pressed', 'true'); $('vPhone').setAttribute('aria-pressed', 'false'); });
  $('vPhone').addEventListener('click', function () { $('frame').classList.add('phone'); this.setAttribute('aria-pressed', 'true'); $('vPc').setAttribute('aria-pressed', 'false'); });
  $('undo').addEventListener('click', function () { jump(-1); });
  $('redo').addEventListener('click', function () { jump(1); });
  FONTS.forEach(function (f) { var o = document.createElement('option'); o.value = f[0]; o.textContent = f[1]; $('font').appendChild(o); });
  $('font').addEventListener('change', function () { S.font = this.value; commitAll(); });
  $('accent').addEventListener('input', function () { var v = this.value; later(function () { S.accent = v; commitAll(); }); });
  document.addEventListener('keydown', function (e) {
    var t = e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); jump(e.shiftKey ? 1 : -1); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); jump(1); }
    else if (e.key === 'Escape' && selEl) { selEl = selEl.parentElement && selEl.parentElement.tagName !== 'HTML' ? selEl.parentElement : null; markSel(true); drawProps(); }
  });

  drawBlocks();
  if (RESTORED) setTimeout(function () { toast('이 컴퓨터에 남아 있던 작업을 이어서 불러왔어요. 내 것이 아니면 "처음부터"를 눌러요. (1시간 동안 쓰지 않으면 자동으로 지워져요)', 'alert'); }, 600);
  load();
  if (S.pages.length) pushHist(); else undoUi();
  all();
  window.__studio = { get S() { return S; }, insert: insert, issues: issues };
})();
</script>
</body>
</html>
