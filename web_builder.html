<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>웹페이지 만들기 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 왼쪽 요소 넣기·구성 | 가운데 미리보기(생성 코드를 그대로 실행) + 코드 | 오른쪽 고치기. 학습지와 같은 톤 */
:root {
  --bg: #FBEFF2; --paper: #FFFFFF; --ink: #191F28; --muted: #6B7684; --line: #ECEEF1; --soft: #F7F8FA;
  --accent: #E5486F; --accent-soft: #FDE7EC; --ok: #1BA672;
  --c-html: #E5486F; --c-css: #3B82F6; --c-js: #D97706;
  --code-bg: #1E1A22; --code-ink: #EDE7EF; --code-dim: #8D8394;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.55; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; }
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid #EAD9DE; }
.top-in { display: flex; align-items: center; gap: 8px; padding: 10px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.tag { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.top h1 { font-size: 17px; font-weight: 800; margin: 0 6px 0 0; letter-spacing: -.02em; }
.top .sp { flex: 1; }
.btn { border: 0; background: #fff; color: #333D4B; border-radius: 9px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pri { background: var(--accent); color: #fff; }
.hubbtn { background: var(--accent); color: #fff; text-decoration: none; display: inline-flex; align-items: center; font-weight: 800; padding: 7px 14px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.hubbtn:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; background: #F2F4F6; }
.btn:focus-visible, .add button:focus-visible, .layers li:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 16px; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 40px max(18px, env(safe-area-inset-left, 0px)); align-items: start; }
.panel { background: var(--paper); border-radius: 16px; padding: 14px; box-shadow: 0 2px 12px rgba(25,31,40,.05); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.left, .props { position: sticky; top: 66px; max-height: calc(100vh - 86px); overflow: auto; }
.panel h2 { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; margin: 4px 2px 0; }
.add { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.add button { border: 0; background: var(--soft); border-radius: 10px; padding: 7px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 11.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.add button span { font-size: 16px; line-height: 1.3; }
.add button:hover { background: var(--accent-soft); }
.addgrp { font-size: 11.5px; font-weight: 700; color: var(--muted); grid-column: 1 / -1; margin-top: 4px; }
.target { font-size: 12.5px; background: var(--accent-soft); color: #B4234A; border-radius: 8px; padding: 6px 10px; }
.layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.layers li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; background: var(--soft); border-radius: 9px; padding: 4px 5px 4px 10px; cursor: pointer; font-size: 12.5px; }
.layers li.slot { background: transparent; border: 1.5px dashed #E3C3CE; color: var(--muted); font-weight: 700; }
.layers li.slot.tg { border-color: var(--accent); color: var(--accent); background: #FFF6F8; }
.layers li.sel { background: var(--accent-soft); color: #B4234A; font-weight: 700; }
.layers li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layers li .ops { display: flex; gap: 2px; }
.layers li .ops button { border: 0; background: #fff; border-radius: 6px; width: 22px; height: 22px; cursor: pointer; font-size: 11px; color: #4E5968; padding: 0; }

.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: #fff; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.stage-note { font-size: 12.5px; color: var(--muted); }
.frame-wrap { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(25,31,40,.05); padding: 10px; display: flex; justify-content: center; }
.frame-wrap iframe { width: 100%; height: 460px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.frame-wrap.phone iframe { width: 375px; max-width: 100%; height: 560px; border-radius: 26px; border: 8px solid #2B2B33; }

.props .empty { color: var(--muted); font-size: 13.5px; background: var(--soft); border-radius: 10px; padding: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld > span { font-size: 12.5px; font-weight: 700; color: #4E5968; }
.fld small { color: var(--muted); font-size: 12px; }
.fld input[type=text], .fld input[type=url], .fld input[type=number], .fld select, .fld textarea { border: 1px solid #E5E8EB; border-radius: 8px; padding: 7px 9px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
.fld textarea { resize: vertical; min-height: 78px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.colorrow, .rangerow { display: flex; align-items: center; gap: 8px; }
.colorrow input[type=color] { width: 44px; height: 32px; border: 1px solid #E5E8EB; border-radius: 8px; padding: 2px; background: #fff; cursor: pointer; }
.colorrow .val, .rangerow output { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rangerow input { flex: 1; accent-color: var(--accent); }
.rangerow output { min-width: 44px; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { border: 1px solid #E5E8EB; background: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.sep { height: 1px; background: var(--line); margin: 4px 0; }
details.more { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
details.more summary { cursor: pointer; font-weight: 800; font-size: 13px; }
details.more[open] > div { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.thumbs div { position: relative; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; }
.thumbs button { position: absolute; top: 2px; right: 2px; border: 0; background: rgba(0,0,0,.6); color: #fff; border-radius: 4px; font-size: 10px; cursor: pointer; }
.upl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.upl label { background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.upl input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.codebox { background: var(--code-bg); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.code-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: var(--code-ink); flex-wrap: wrap; border-bottom: 1px solid #2E2833; }
.code-bar b { font-size: 14px; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--code-dim); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.code-bar .sp { flex: 1; }
.code { margin: 0; max-height: 340px; overflow: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 8px 0; color: var(--code-ink); }
.ln { display: grid; grid-template-columns: 44px 4px 1fr; gap: 10px; white-space: pre; min-width: max-content; padding-right: 16px; }
.ln .no { color: #5D5462; text-align: right; user-select: none; }
.ln .bar { border-radius: 2px; }
.ln.html .bar { background: var(--c-html); } .ln.css .bar { background: var(--c-css); } .ln.js .bar { background: var(--c-js); } .ln.data .bar { background: #555; }
.ln.data { color: var(--code-dim); }
.ln .dim { color: var(--code-dim); font-style: italic; }
.ln.chg { background: rgba(255, 214, 102, .22); animation: blink 1.6s ease-out; }
.ln.focus { background: rgba(229, 72, 111, .25); }
@keyframes blink { from { background: rgba(255, 214, 102, .6); } to { background: rgba(255, 214, 102, .22); } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px); }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(25,31,40,.45); display: grid; place-items: center; padding: 16px; }
.modal .box { background: #fff; border-radius: 16px; padding: 20px; width: min(640px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h3 { margin: 0; font-size: 18px; }
.modal textarea { width: 100%; min-height: 180px; border: 1px solid #E5E8EB; border-radius: 10px; padding: 10px; font-family: var(--mono); font-size: 12px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.tpl { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.tpl button { border: 1px solid #E5E8EB; background: #fff; border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tpl button b { font-size: 15px; }
.tpl button span { font-size: 12.5px; color: var(--muted); }
.tpl button:hover { border-color: var(--accent); }

@media (prefers-reduced-motion: reduce) { .ln.chg { animation: none; } }
@media (max-width: 1180px) { .app { grid-template-columns: 230px minmax(0, 1fr); } .props { grid-column: 2; position: static; max-height: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .stage { order: 1; } .props { order: 2; grid-column: 1; position: static; max-height: none; } .left { order: 3; position: static; max-height: none; }
  .add { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .left { position: static; max-height: none; }
  .props { grid-column: 1; }
  .frame-wrap iframe { height: 520px; }
}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <a class="btn hubbtn" href="./index.html" title="실습 허브로 돌아가기">← 실습 허브</a>
  <span class="tag">1차시</span><h1>웹페이지 만들기 도구</h1>
  <button class="btn" type="button" id="undoBtn" title="Ctrl+Z">↶ 실행 취소</button>
  <button class="btn" type="button" id="redoBtn" title="Ctrl+Y">↷ 다시 실행</button>
  <span class="sp"></span>
  <button class="btn" type="button" id="newBtn">새로 시작</button>
  <button class="btn" type="button" id="loadBtn">코드 불러오기</button>
  <button class="btn" type="button" id="saveBtn">index.html 저장</button>
  <button class="btn pri" type="button" id="copyBtn">코드 전체 복사</button>
</div></div>

<div class="app">
  <aside class="panel left">
    <h2>요소 넣기</h2>
    <div class="target" id="targetInfo"></div>
    <div class="add" id="addBox"></div>
    <div class="sep"></div>
    <h2>내 페이지 구성 (위에서부터)</h2>
    <ul class="layers" id="layers"></ul>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <div class="seg" role="group" aria-label="미리보기 크기">
        <button type="button" id="vPc" aria-pressed="true">PC 화면</button>
        <button type="button" id="vPhone" aria-pressed="false">폰 화면</button>
      </div>
      <span class="stage-note">미리보기는 아래 코드를 그대로 실행한 화면이에요. 요소를 누르면 선택돼요. 화면이 좁으면 Windows키+↑로 창을 최대화하세요.</span>
    </div>
    <div class="frame-wrap" id="frameWrap"><iframe id="pv" title="내 웹페이지 미리보기"></iframe></div>
    <section class="codebox">
      <div class="code-bar">
        <b>index.html 코드</b>
        <span class="legend"><span><i style="background:var(--c-html)"></i>HTML 구조</span><span><i style="background:var(--c-css)"></i>CSS 디자인</span><span><i style="background:var(--c-js)"></i>JavaScript 동작</span><span><i style="background:rgba(255,214,102,.7)"></i>방금 바뀐 줄</span></span>
        <span class="sp"></span>
        <button class="btn sm" type="button" id="copyBtn2">복사</button>
      </div>
      <pre class="code" id="code" aria-label="생성된 코드"></pre>
    </section>
  </section>

  <aside class="panel props" id="props"></aside>
</div>

<script>

  document.getElementById('loadBtn').addEventListener('click', function () {

      row.appendChild(c); row.appendChild(ok); bx.appendChild(row);

  });
  function importCode(src) {
    try {
      var doc = new DOMParser().parseFromString(src, 'text/html');
      var el = doc.getElementById('builder-data'); if (!el) return false;
      var d = JSON.parse(el.textContent); if (!d || !d.blocks) return false;
      walk(d.blocks, function (b) {
        if (b.type === 'image' && b.p.src === '@img') { var im = doc.querySelector('#b' + b.id + ' img'); b.p.src = im ? im.getAttribute('src') : ''; }
        if (b.type === 'gallery') { var ims = doc.querySelectorAll('#b' + b.id + ' img'); b.p.imgs = Array.prototype.map.call(ims, function (x) { return x.getAttribute('src'); }); }
      });
      var mx = 0; walk(d.blocks, function (x) { mx = Math.max(mx, x.id || 0); }); d.next = mx + 1; S = d; sel = null; target = 'root'; prevLines = []; commit(true); return true;
    } catch (e) { return false; }
  }
  var vPc = document.getElementById('vPc'), vPh = document.getElementById('vPhone'), fw = document.getElementById('frameWrap');
